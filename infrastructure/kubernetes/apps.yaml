apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: flowcart
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog-service } }
  template:
    metadata: { labels: { app: catalog-service } }
    spec:
      containers:
        - name: catalog-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/flowcart-catalog-service:latest
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: flowcart-db, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: flowcart-db, key: DB_PASSWORD } } }
            - { name: DB_URL, value: "jdbc:postgresql://postgres.example.internal:5432/flowcart?currentSchema=catalog" }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: flowcart
spec:
  selector: { app: catalog-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
