server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: inventory-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: ${spring.application.name}
        hostname: ${CONSUL_DISCOVERY_HOSTNAME:localhost}
        instance-id: ${spring.application.name}-${SERVER_PORT:8083}
        register-health-check: ${CONSUL_REGISTER_HEALTH_CHECK:false}
        health-check-path: /actuator/health
        health-check-interval: 10s
        query-passing: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowcart?currentSchema=inventory}
    username: ${DB_USER:flowcart}
    password: ${DB_PASSWORD:flowcart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    default-schema: inventory
    schemas: inventory
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: dev.houssam.flowcart.events
        spring.json.value.default.type: dev.houssam.flowcart.events.DomainEvent

flowcart:
  kafka:
    events-topic: flowcart.events
  outbox:
    publish-delay-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
