services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowcart
      POSTGRES_USER: flowcart
      POSTGRES_PASSWORD: flowcart
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcart -d flowcart"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1; do sleep 2; done;
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic flowcart.events --partitions 3 --replication-factor 1;
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic flowcart.events"

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/flowcart?currentSchema=catalog
      DB_USER: flowcart
      DB_PASSWORD: flowcart
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/flowcart?currentSchema=orders
      DB_USER: flowcart
      DB_PASSWORD: flowcart
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CATALOG_BASE_URL: http://catalog-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      catalog-service:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/flowcart?currentSchema=inventory
      DB_USER: flowcart
      DB_PASSWORD: flowcart
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/flowcart?currentSchema=payment
      DB_USER: flowcart
      DB_PASSWORD: flowcart
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/flowcart?currentSchema=notification
      DB_USER: flowcart
      DB_PASSWORD: flowcart
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - catalog-service
      - order-service

volumes:
  postgres-data:
