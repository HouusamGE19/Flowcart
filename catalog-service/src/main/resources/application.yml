server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: ${spring.application.name}
        hostname: ${CONSUL_DISCOVERY_HOSTNAME:localhost}
        instance-id: ${spring.application.name}-${SERVER_PORT:8081}
        register-health-check: ${CONSUL_REGISTER_HEALTH_CHECK:false}
        health-check-path: /actuator/health
        health-check-interval: 10s
        query-passing: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowcart?currentSchema=catalog}
    username: ${DB_USER:flowcart}
    password: ${DB_PASSWORD:flowcart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    default-schema: catalog
    schemas: catalog

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
