server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowcart?currentSchema=catalog}
    username: ${DB_USER:flowcart}
    password: ${DB_PASSWORD:flowcart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    default-schema: catalog
    schemas: catalog

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
